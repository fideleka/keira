<text x="573" y="556" font-size="16" text-anchor="start" style="fill:#253448">6  COM2 / DIN</text>
<text x="65" y="647" font-size="17" text-anchor="start" style="fill:#253448">Numbers are IC pins and matching adapter header numbers.</text>
