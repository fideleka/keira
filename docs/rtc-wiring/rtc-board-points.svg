<text x="1065" y="157" font-size="23" text-anchor="start" style="fill:#253448" font-weight="bold">J5 signal row • enlarged</text>
<circle cx="1080" cy="213" r="10" fill="#1760a0"/>
<text x="1105" y="219" font-size="19" text-anchor="start" style="fill:#1760a0" font-weight="bold">1  LRCK / GPIO1</text>
<text x="1105" y="243" font-size="16" text-anchor="start" style="fill:#253448">→ U1 pin 10 COM1</text>
<circle cx="1080" cy="280" r="10" fill="#1760a0"/>
<text x="1105" y="286" font-size="19" text-anchor="start" style="fill:#1760a0" font-weight="bold">2  BCK / GPIO42</text>
<text x="1105" y="310" font-size="16" text-anchor="start" style="fill:#253448">→ R1 1k detector input</text>
<circle cx="1080" cy="347" r="10" fill="#1760a0"/>
<text x="1105" y="353" font-size="19" text-anchor="start" style="fill:#1760a0" font-weight="bold">3  DIN / GPIO2</text>
<text x="1105" y="377" font-size="16" text-anchor="start" style="fill:#253448">→ U1 pin 6 COM2</text>
<circle cx="1080" cy="414" r="10" fill="#8a949e"/>
<text x="1105" y="420" font-size="19" text-anchor="start" style="fill:#8a949e" font-weight="bold">4  GAIN</text>
<text x="1105" y="444" font-size="16" text-anchor="start" style="fill:#253448">Leave untouched</text>
<circle cx="1080" cy="481" r="10" fill="#8a949e"/>
<text x="1105" y="487" font-size="19" text-anchor="start" style="fill:#8a949e" font-weight="bold">5  SD / SLEEP</text>
<text x="1105" y="511" font-size="16" text-anchor="start" style="fill:#253448">Leave untouched / GPIO46</text>
<circle cx="1080" cy="548" r="10" fill="#1760a0"/>
<text x="1105" y="554" font-size="19" text-anchor="start" style="fill:#1760a0" font-weight="bold">6  GND</text>
<text x="1105" y="578" font-size="16" text-anchor="start" style="fill:#253448">Common system ground</text>
<circle cx="1080" cy="615" r="10" fill="#1760a0"/>
<text x="1105" y="621" font-size="19" text-anchor="start" style="fill:#1760a0" font-weight="bold">7  VIN = +3V3</text>
<text x="1105" y="645" font-size="16" text-anchor="start" style="fill:#253448">Power to all three devices</text>
<text x="1065" y="697" font-size="17" text-anchor="start" style="fill:#253448">1 is above 7 in this rear view.</text>
<rect x="40" y="750" width="1420" height="194" rx="6" fill="#fff6e9" stroke="#b7c6d6" stroke-width="2"/>
<text x="65" y="789" font-size="21" text-anchor="start" style="fill:#253448" font-weight="bold">Solder to the existing J5 signal-row joints; amplifier stays connected directly as before.</text>
<text x="65" y="828" font-size="18" text-anchor="start" style="fill:#253448">Confirm the pad by its amplifier label and continuity to the matching J5 net. Actual installed-module access varies.</text>
<text x="65" y="866" font-size="18" text-anchor="start" style="fill:#a95b08">Speaker OUT− is NOT ground. Do not use battery B+/B−, USB 5V, or the amplifier SD/SLEEP pad for this circuit.</text>
<text x="65" y="905" font-size="18" text-anchor="start" style="fill:#253448">Source: Lilka hardware/v2/main.kicad_pcb. Your board is marked 2.3; verify labels/net continuity before soldering.</text>
