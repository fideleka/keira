<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker></defs><rect width="1200" height="840" fill="#f8fafc"/><text x="40" y="48" font-family="sans-serif" font-size="30" fill="#172033" text-anchor="start" font-weight="bold">Lilka → ESP32 Bluetooth audio bridge</text><text x="40" y="80" font-family="sans-serif" font-size="17" fill="#172033" text-anchor="start" font-weight="normal">Proposed bench wiring • classic ESP32 DevKit / ESP-WROOM-32 • not plug-and-play firmware</text><path d="M310 250 L650 250" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="238" font-family="sans-serif" font-size="16" fill="#172033" text-anchor="middle" font-weight="normal">I²S BCLK</text><path d="M310 310 L650 310" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="298" font-family="sans-serif" font-size="16" fill="#172033" text-anchor="middle" font-weight="normal">I²S LRCK / WS</text><path d="M310 370 L650 370" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="358" font-family="sans-serif" font-size="16" fill="#172033" text-anchor="middle" font-weight="normal">I²S DATA → receiver</text><path d="M310 440 L650 440" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="428" font-family="sans-serif" font-size="16" fill="#172033" text-anchor="middle" font-weight="normal">Control TX → RX</text><path d="M650 500 L310 500" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="488" font-family="sans-serif" font-size="16" fill="#172033" text-anchor="middle" font-weight="normal">Status RX ← TX</text><path d="M310 560 L650 560" fill="none" stroke="#475569" stroke-width="3"/><text x="480" y="548" font-family="sans-serif" font-size="16" fill="#172033" text-anchor="middle" font-weight="normal">Common ground</text><path d="M930 265 L1000 265" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="150" width="270" height="450" rx="14" fill="#e2e8f0" stroke="#64748b"/><rect x="650" y="150" width="280" height="450" rx="14" fill="#dbeafe" stroke="#64748b"/><rect x="1000" y="195" width="160" height="140" rx="14" fill="#fef3c7" stroke="#64748b"/><text x="64" y="185" font-family="sans-serif" font-size="24" fill="#172033" text-anchor="start" font-weight="bold">LILKA v2</text><text x="64" y="212" font-family="sans-serif" font-size="17" fill="#172033" text-anchor="start" font-weight="normal">Extension header</text><text x="674" y="185" font-family="sans-serif" font-size="24" fill="#172033" text-anchor="start" font-weight="bold">ESP32 DevKit</text><text x="674" y="212" font-family="sans-serif" font-size="16" fill="#172033" text-anchor="start" font-weight="normal">Labels on your pictured board</text><text x="64" y="256" font-family="sans-serif" font-size="17" fill="#172033" text-anchor="start" font-weight="normal">GPIO12</text><text x="674" y="256" font-family="sans-serif" font-size="17" fill="#172033" text-anchor="start" font-weight="normal">D26 / GPIO26</text><circle cx="310" cy="250" r="5" fill="#172033"/><circle cx="650" cy="250" r="5" fill="#172033"/><text x="64" y="316" font-family="sans-serif" font-size="17" fill="#172033" text-anchor="start" font-weight="normal">GPIO13</text><text x="674" y="316" font-family="sans-serif" font-size="17" fill="#172033" text-anchor="start" font-weight="normal">D25 / GPIO25</text><circle cx="310" cy="310" r="5" fill="#172033"/><circle cx="650" cy="310" r="5" fill="#172033"/><text x="64" y="376" font-family="sans-serif" font-size="17" fill="#172033" text-anchor="start" font-weight="normal">GPIO14</text><text x="674" y="376" font-family="sans-serif" font-size="17" fill="#172033" text-anchor="start" font-weight="normal">D22 / GPIO22</text><circle cx="310" cy="370" r="5" fill="#172033"/><circle cx="650" cy="370" r="5" fill="#172033"/><text x="64" y="446" font-family="sans-serif" font-size="17" fill="#172033" text-anchor="start" font-weight="normal">GPIO47 — UART TX</text><text x="674" y="446" font-family="sans-serif" font-size="17" fill="#172033" text-anchor="start" font-weight="normal">RX2 / GPIO16</text><circle cx="310" cy="440" r="5" fill="#172033"/><circle cx="650" cy="440" r="5" fill="#172033"/><text x="64" y="506" font-family="sans-serif" font-size="17" fill="#172033" text-anchor="start" font-weight="normal">GPIO48 — UART RX</text><text x="674" y="506" font-family="sans-serif" font-size="17" fill="#172033" text-anchor="start" font-weight="normal">TX2 / GPIO17</text><circle cx="310" cy="500" r="5" fill="#172033"/><circle cx="650" cy="500" r="5" fill="#172033"/><text x="64" y="566" font-family="sans-serif" font-size="17" fill="#172033" text-anchor="start" font-weight="normal">GND</text><text x="674" y="566" font-family="sans-serif" font-size="17" fill="#172033" text-anchor="start" font-weight="normal">GND</text><circle cx="310" cy="560" r="5" fill="#172033"/><circle cx="650" cy="560" r="5" fill="#172033"/><text x="1024" y="232" font-family="sans-serif" font-size="18" fill="#172033" text-anchor="start" font-weight="bold">Bluetooth</text><text x="1024" y="260" font-family="sans-serif" font-size="17" fill="#172033" text-anchor="start" font-weight="normal">headphones</text><text x="1024" y="286" font-family="sans-serif" font-size="17" fill="#172033" text-anchor="start" font-weight="normal">or speaker</text><text x="963" y="245" font-family="sans-serif" font-size="13" fill="#172033" text-anchor="middle" font-weight="normal">A2DP</text><rect x="40" y="625" width="1120" height="175" rx="14" fill="#ffffff" stroke="#64748b"/><text x="64" y="656" font-family="sans-serif" font-size="20" fill="#172033" text-anchor="start" font-weight="bold">POWER: ESP32 micro-USB ← separate 5 V USB supply</text><text x="64" y="689" font-family="sans-serif" font-size="18" fill="#172033" text-anchor="start" font-weight="normal">Leave Lilka 3.3 V and ESP32 VIN / 3V3 unconnected to each other. Connect GND only.</text><text x="64" y="721" font-family="sans-serif" font-size="18" fill="#172033" text-anchor="start" font-weight="normal">Audio: Lilka I²S master TX → ESP32 I²S slave RX → A2DP source (not A2DP sink).</text><text x="64" y="752" font-family="sans-serif" font-size="18" fill="#172033" text-anchor="start" font-weight="normal">UART: 3.3 V logic, proposed 115200 baud. Pin assignments must match both firmwares.</text><text x="64" y="782" font-family="sans-serif" font-size="17" fill="#475569" text-anchor="start" font-weight="normal">Logical wiring, not header orientation. Wire by board labels; keep I²S leads short.</text></svg>