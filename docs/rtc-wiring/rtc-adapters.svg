<text x="870" y="588" font-size="21" text-anchor="middle" style="fill:#253448" font-weight="bold">1</text>
<rect x="959" y="254" width="32" height="32" rx="6" fill="#d9e5d9" stroke="#08796b" stroke-width="2"/>
<text x="975" y="240" font-size="21" text-anchor="middle" style="fill:#253448" font-weight="bold">9</text>
<rect x="959" y="524" width="32" height="32" rx="6" fill="#d9e5d9" stroke="#08796b" stroke-width="2"/>
<text x="975" y="588" font-size="21" text-anchor="middle" style="fill:#253448" font-weight="bold">2</text>
<rect x="1064" y="254" width="32" height="32" rx="6" fill="#d9e5d9" stroke="#08796b" stroke-width="2"/>
<text x="1080" y="240" font-size="21" text-anchor="middle" style="fill:#253448" font-weight="bold">8</text>
<rect x="1064" y="524" width="32" height="32" rx="6" fill="#d9e5d9" stroke="#08796b" stroke-width="2"/>
<text x="1080" y="588" font-size="21" text-anchor="middle" style="fill:#253448" font-weight="bold">3</text>
