<rect x="1274" y="524" width="32" height="32" rx="6" fill="#d9e5d9" stroke="#08796b" stroke-width="2"/>
<text x="1290" y="588" font-size="21" text-anchor="middle" style="fill:#253448" font-weight="bold">5</text>
<rect x="935" y="335" width="290" height="140" rx="6" fill="#34475b" stroke="#34475b" stroke-width="2"/>
<circle cx="955" cy="453" r="7" fill="#ffffff"/>
<polyline class="wire" points="975,286 975,335" stroke="#1760a0"/>
<text x="975" y="321" font-size="17" text-anchor="middle" style="fill:#253448">IC 5</text>
<text x="975" y="216" font-size="17" text-anchor="middle" style="fill:#253448">3.3 V</text>
<polyline class="wire" points="1185,286 1185,335" stroke="#a95b08"/>
<text x="1185" y="321" font-size="17" text-anchor="middle" style="fill:#253448">IC 4</text>
<text x="1185" y="216" font-size="17" text-anchor="middle" style="fill:#253448">SELECT</text>
<polyline class="wire" points="975,475 975,524" stroke="#1760a0"/>
<text x="975" y="509" font-size="17" text-anchor="middle" style="fill:#253448">IC 1</text>
<text x="975" y="625" font-size="17" text-anchor="middle" style="fill:#253448">NC/open</text>
<polyline class="wire" points="1080,475 1080,524" stroke="#1760a0"/>
<text x="1080" y="509" font-size="17" text-anchor="middle" style="fill:#253448">IC 2</text>
<text x="1080" y="625" font-size="17" text-anchor="middle" style="fill:#253448">ENV</text>
<polyline class="wire" points="1185,475 1185,524" stroke="#1760a0"/>
<text x="1185" y="509" font-size="17" text-anchor="middle" style="fill:#253448">IC 3</text>
<text x="1185" y="625" font-size="17" text-anchor="middle" style="fill:#253448">GND</text>
<text x="770" y="657" font-size="17" text-anchor="start" style="fill:#253448">3-leg side faces down; middle three positions are used.</text>
<rect x="40" y="710" width="1420" height="278" rx="6" fill="#fff6e9" stroke="#b7c6d6" stroke-width="2"/>
<text x="65" y="749" font-size="23" text-anchor="start" style="fill:#253448" font-weight="bold">Buffer mapping: IC pin → carrier pad</text>
<text x="65" y="790" font-size="20" text-anchor="start" style="fill:#253448">1 NC → 2 (leave open)     2 A → 3 (ENV)     3 GND → 4     4 Y → 7 (SELECT)     5 VCC → 9 (3.3 V)</text>
<text x="65" y="832" font-size="18" text-anchor="start" style="fill:#253448">Carrier pads 1, 5, 6, 8, 10 stay unused. Dry-fit first: 0.95mm pitch alone does not guarantee row-spacing fit.</text>
<text x="65" y="874" font-size="18" text-anchor="start" style="fill:#a95b08" font-weight="bold">Never mount the switch and buffer on opposite faces of ONE adapter: the shared header nets would short them.</text>
<text x="65" y="916" font-size="18" text-anchor="start" style="fill:#253448">Cbuf sits close to buffer IC pins 5 and 3 (carrier pads 9 and 4); Csw close to switch pins 8 and 3.</text>
<text x="65" y="955" font-size="18" text-anchor="start" style="fill:#253448">Read the actual pin-1 mark and carrier numbering. Views from the underside are mirrored.</text>
</svg>
