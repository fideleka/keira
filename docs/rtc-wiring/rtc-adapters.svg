<text x="770" y="153" font-size="22" text-anchor="start" style="fill:#253448" font-weight="bold">U2: SN74LVC1G17DBVR • 0.95mm side</text>
<text x="770" y="184" font-size="18" text-anchor="start" style="fill:#253448">Your SOT2310 carrier, oriented exactly as in your photo</text>
