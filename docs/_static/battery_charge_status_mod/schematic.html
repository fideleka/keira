<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lilka v2 ADC charge-status modification</title>
<style>
  :root { color-scheme: light dark; --bg:#f8fafc; --fg:#172033; --muted:#5b6475; --line:#64748b; --neutral:#e2e8f0; --input:#bfdbfe; --process:#c7d2fe; --external:#fde68a; --risk:#fecaca; --charge:#d97706; --done:#15803d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --fg:#e5e7eb; --muted:#a3adbd; --line:#94a3b8; --neutral:#334155; --input:#1d4ed8; --process:#4338ca; --external:#92400e; --risk:#991b1b; --charge:#fbbf24; --done:#4ade80; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  main { max-width:1160px; margin:32px auto; padding:0 20px; }
  svg { width:100%; height:auto; display:block; }
  .title { font-size:22px; font-weight:700; fill:var(--fg); }
  .subtitle { font-size:13px; fill:var(--muted); }
  .label { font-size:14px; font-weight:650; fill:var(--fg); }
  .small { font-size:12px; fill:var(--muted); }
  .tiny { font-size:11px; fill:var(--muted); }
  .node { stroke:var(--line); stroke-width:1.5; }
  .neutral { fill:var(--neutral); } .input { fill:var(--input); } .process { fill:var(--process); } .external { fill:var(--external); } .risk { fill:var(--risk); }
  .edge { stroke:var(--line); stroke-width:2; fill:none; }
  .charge-edge { stroke:var(--charge); stroke-width:2.5; fill:none; }
  .done-edge { stroke:var(--done); stroke-width:2.5; fill:none; }
  .light-edge { stroke:var(--line); stroke-width:1.5; stroke-dasharray:5 4; fill:none; }
  .zone { fill:none; stroke:var(--line); stroke-width:1.2; stroke-dasharray:7 5; }
  .junction { fill:var(--fg); } .ground { stroke:var(--line); stroke-width:2; }
</style>
<main>
  <svg viewBox="0 0 1120 840" role="img" aria-labelledby="title description">
    <title id="title">Lilka v2 charging-status encoding through the battery ADC</title>
    <desc id="description">CHRG and STDBY drive two channels of an EL827 optocoupler. Its outputs switch 33 kilo-ohm and 10 kilo-ohm pull-down resistors onto the existing VVAL battery ADC node.</desc>
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--line)" /></marker></defs>

    <text x="28" y="36" class="title">Lilka v2 · TP4056 status over the existing VVAL ADC</text>
    <text x="28" y="61" class="subtitle">No extension GPIOs · dual optocoupler · state encoded by safe downward ADC shifts</text>

    <!-- Connector paths are behind the nodes. -->
    <path class="edge" d="M80 174 H150" /><path class="edge" d="M230 174 H408" /><path class="charge-edge" d="M508 174 H610" />
    <path class="edge" d="M80 294 H150" /><path class="edge" d="M230 294 H408" /><path class="done-edge" d="M508 294 H610" />
    <path class="light-edge" d="M458 202 C470 262 535 296 590 341" marker-end="url(#arrow)" />
    <path class="light-edge" d="M458 322 C470 380 535 416 590 461" marker-end="url(#arrow)" />
    <path class="edge" d="M820 168 H860" /><path class="edge" d="M940 168 H1080" marker-end="url(#arrow)" />
    <path class="edge" d="M1000 168 V485" /><path class="edge" d="M1000 220 H1050 V248" /><path class="edge" d="M1050 298 V550" />
    <path class="charge-edge" d="M1000 365 H880" /><path class="charge-edge" d="M790 365 H650" /><path class="charge-edge" d="M590 390 V550" />
    <path class="done-edge" d="M1000 485 H880" /><path class="done-edge" d="M790 485 H650" /><path class="done-edge" d="M590 510 V550" />

    <rect x="28" y="96" width="338" height="270" rx="14" class="zone" />
    <text x="48" y="124" class="label">TP4056 / 5 V status side</text><text x="48" y="144" class="small">Two current-limited optocoupler feeds</text>
    <rect x="40" y="151" width="40" height="46" rx="8" class="node external" /><text x="60" y="179" text-anchor="middle" class="label">5 V</text>
    <rect x="150" y="151" width="80" height="46" rx="8" class="node neutral" /><text x="190" y="179" text-anchor="middle" class="label">2.2 kΩ</text>
    <rect x="40" y="271" width="40" height="46" rx="8" class="node external" /><text x="60" y="299" text-anchor="middle" class="label">5 V</text>
    <rect x="150" y="271" width="80" height="46" rx="8" class="node neutral" /><text x="190" y="299" text-anchor="middle" class="label">2.2 kΩ</text>

    <rect x="388" y="96" width="292" height="446" rx="14" class="zone" />
    <text x="408" y="124" class="label">EL827 dual optocoupler</text><text x="408" y="144" class="small">Two isolated LED + phototransistor channels</text>
    <rect x="408" y="146" width="100" height="56" rx="10" class="node input" /><text x="458" y="170" text-anchor="middle" class="label">LED 1</text><text x="458" y="188" text-anchor="middle" class="small">charging</text>
    <rect x="610" y="151" width="58" height="46" rx="8" class="node external" /><text x="639" y="171" text-anchor="middle" class="label">CHRG</text><text x="639" y="188" text-anchor="middle" class="tiny">pad · low</text>
    <rect x="408" y="266" width="100" height="56" rx="10" class="node input" /><text x="458" y="290" text-anchor="middle" class="label">LED 2</text><text x="458" y="308" text-anchor="middle" class="small">charge done</text>
    <rect x="610" y="271" width="58" height="46" rx="8" class="node external" /><text x="639" y="291" text-anchor="middle" class="label">STDBY</text><text x="639" y="308" text-anchor="middle" class="tiny">pad · low</text>
    <rect x="550" y="340" width="100" height="50" rx="9" class="node process" /><text x="600" y="362" text-anchor="middle" class="label">Q1 output</text><text x="600" y="380" text-anchor="middle" class="tiny">collector → emitter</text>
    <rect x="550" y="460" width="100" height="50" rx="9" class="node process" /><text x="600" y="482" text-anchor="middle" class="label">Q2 output</text><text x="600" y="500" text-anchor="middle" class="tiny">collector → emitter</text>

    <rect x="720" y="96" width="372" height="470" rx="14" class="zone" />
    <text x="740" y="124" class="label">Lilka 3.3 V / ADC side</text><text x="740" y="144" class="small">Existing divider plus two switched pull-down tags</text>
    <rect x="730" y="145" width="90" height="46" rx="8" class="node external" /><text x="775" y="173" text-anchor="middle" class="label">Battery/Q1</text>
    <rect x="860" y="145" width="80" height="46" rx="8" class="node neutral" /><text x="900" y="173" text-anchor="middle" class="label">R4 33 kΩ</text>
    <circle cx="1000" cy="168" r="6" class="junction" /><text x="1014" y="158" class="label">VVAL</text><text x="1014" y="180" class="small">GPIO3 ADC</text><text x="1083" y="162" class="label">ADC</text>
    <rect x="1022" y="248" width="56" height="50" rx="8" class="node neutral" /><text x="1050" y="270" text-anchor="middle" class="label">R2</text><text x="1050" y="288" text-anchor="middle" class="small">100 kΩ</text>
    <rect x="790" y="342" width="90" height="46" rx="8" class="node external" /><text x="835" y="370" text-anchor="middle" class="label">33 kΩ</text><text x="898" y="357" class="small">CHRG tag</text>
    <rect x="790" y="462" width="90" height="46" rx="8" class="node external" /><text x="835" y="490" text-anchor="middle" class="label">10 kΩ</text><text x="898" y="477" class="small">DONE tag</text>

    <line x1="550" y1="550" x2="1070" y2="550" class="ground" /><line x1="784" y1="550" x2="784" y2="564" class="ground" /><line x1="765" y1="564" x2="803" y2="564" class="ground" /><line x1="772" y1="572" x2="796" y2="572" class="ground" /><line x1="779" y1="580" x2="789" y2="580" class="ground" /><text x="812" y="573" class="label">GND</text>

    <rect x="28" y="612" width="1064" height="142" rx="14" class="node neutral" opacity="0.55" />
    <text x="50" y="643" class="label">Expected ADC bands for VBAT 3.0–4.2 V</text>
    <text x="50" y="678" class="label">Battery / USB absent</text><text x="235" y="678" class="small">no tag</text><text x="315" y="678" class="small">GPIO3 ≈ 2.26–3.16 V</text>
    <text x="560" y="678" class="label" fill="var(--charge)">Charging</text><text x="645" y="678" class="small">33 kΩ tag</text><text x="735" y="678" class="small">GPIO3 ≈ 1.29–1.80 V</text>
    <text x="50" y="718" class="label" fill="var(--done)">Charged</text><text x="235" y="718" class="small">10 kΩ tag</text><text x="315" y="718" class="small">GPIO3 ≈ 0.65–0.91 V</text><text x="560" y="718" class="small">Prototype first; set firmware thresholds from measured bands.</text>

    <rect x="28" y="780" width="1064" height="44" rx="10" class="node risk" /><text x="560" y="807" text-anchor="middle" class="label">Disconnect USB and LiPo before soldering. Verify the delivered EL827 pinout and TP4056 status pads.</text>
  </svg>
</main>
