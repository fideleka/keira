<text x="95" y="399" font-size="18" text-anchor="start" style="fill:#253448">2  BCK / GPIO42</text>
<text x="95" y="425" font-size="16" text-anchor="start" style="fill:#1760a0">→ detector below</text>

<text x="565" y="467" font-size="17" text-anchor="start" style="fill:#253448">8 V+ = 3.3 V; 3 GND = ground</text>

<text x="1185" y="416" font-size="18" text-anchor="start" style="fill:#253448">− = GND</text>
<text x="1185" y="449" font-size="18" text-anchor="start" style="fill:#a95b08">NC: leave OPEN</text>
<text x="65" y="528" font-size="17" text-anchor="start" style="fill:#253448">RTC-side pull-ups only: D → 4.7k → 3.3 V; C → 4.7k → 3.3 V. Omit added resistors if module pull-ups are confirmed.</text>

<text x="65" y="927" font-size="19" text-anchor="start" style="fill:#253448" font-weight="bold">Power: J5 pad 7 VIN = +3V3; J5 pad 6 = GND. Every ground symbol uses this same system ground.</text>
<text x="65" y="958" font-size="18" text-anchor="start" style="fill:#253448">Cbuf 100nF: U2 pins 5 ↔ 3.  Csw 100nF: U1 pins 8 ↔ 3.  Crtc 1µF: module + ↔ −. Place close to each device.</text>
<text x="65" y="989" font-size="18" text-anchor="start" style="fill:#253448">BCK HIGH / clocking → SELECT HIGH → RTC isolated. BCK LOW, after settling → SELECT LOW → RTC connected.</text>
<text x="65" y="1020" font-size="18" text-anchor="start" style="fill:#a95b08">Do not connect SELECT to GPIO46/SLEEP. Provisional waits: 2ms HIGH before audio; 20ms LOW before I²C.</text>

<text x="65" y="832" font-size="18" text-anchor="start" style="fill:#253448">Carrier pads 1, 5, 6, 8, 10 stay unused. Dry-fit first: 0.95mm pitch alone does not guarantee row-spacing fit.</text>
<text x="65" y="874" font-size="18" text-anchor="start" style="fill:#a95b08" font-weight="bold">Never mount the switch and buffer on opposite faces of ONE adapter: the shared header nets would short them.</text>
<text x="65" y="916" font-size="18" text-anchor="start" style="fill:#253448">Cbuf sits close to buffer IC pins 5 and 3 (carrier pads 9 and 4); Csw close to switch pins 8 and 3.</text>
<text x="65" y="955" font-size="18" text-anchor="start" style="fill:#253448">Read the actual pin-1 mark and carrier numbering. Views from the underside are mirrored.</text>
