<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1080">
<style>text{font-family:DejaVu Sans,sans-serif;fill:#253448}.wire{fill:none;stroke-width:3;stroke-linejoin:round}</style>
<rect width="1500" height="1080" fill="#ffffff"/>
<text x="40" y="48" font-size="28" text-anchor="start" style="fill:#253448" font-weight="bold">RTC modification • complete connection diagram</text>
<text x="40" y="82" font-size="17" text-anchor="start" style="fill:#253448">3.3 V only • BCLK envelope selector • firmware-coordinated prototype, not yet bench-qualified</text>
<rect x="40" y="110" width="1420" height="440" rx="6" fill="#f1f5f9" stroke="#b7c6d6" stroke-width="2"/>
<text x="65" y="146" font-size="22" text-anchor="start" style="fill:#253448" font-weight="bold">A. RTC branch — audio wiring stays direct</text>
<rect x="70" y="178" width="270" height="270" rx="6" fill="#eaf3fc" stroke="#b7c6d6" stroke-width="2"/>
<text x="95" y="210" font-size="20" text-anchor="start" style="fill:#253448" font-weight="bold">Lilka / amplifier J5</text>
<rect x="535" y="178" width="440" height="315" rx="6" fill="#f1f5f9" stroke="#b7c6d6" stroke-width="2"/>
<text x="565" y="210" font-size="21" text-anchor="start" style="fill:#253448" font-weight="bold">U1  TS5A23157DGS</text>
<rect x="1160" y="178" width="265" height="315" rx="6" fill="#e9f7f2" stroke="#b7c6d6" stroke-width="2"/>
<text x="1185" y="210" font-size="20" text-anchor="start" style="fill:#253448" font-weight="bold">DS3231 module</text>
<text x="95" y="248" font-size="18" text-anchor="start" style="fill:#253448">1  LRCK / GPIO1</text>
<polyline class="wire" points="340,260 535,260" stroke="#1760a0"/>
<text x="552" y="248" font-size="17" text-anchor="start" style="fill:#253448">10 COM1</text>
<polyline class="wire" points="680,260 835,260" stroke="#08796b"/>
<text x="885" y="248" font-size="17" text-anchor="middle" style="fill:#253448">9 NC1</text>
<polyline class="wire" points="975,260 1160,260" stroke="#08796b"/>
<text x="1185" y="248" font-size="18" text-anchor="start" style="fill:#253448">C / SCL</text>
<text x="745" y="289" font-size="15" text-anchor="middle" style="fill:#08796b">LOW connects NC</text>
<text x="95" y="323" font-size="18" text-anchor="start" style="fill:#253448">3  DIN / GPIO2</text>
<polyline class="wire" points="340,335 535,335" stroke="#1760a0"/>
<text x="552" y="323" font-size="17" text-anchor="start" style="fill:#253448">6 COM2</text>
<polyline class="wire" points="680,335 835,335" stroke="#08796b"/>
<text x="885" y="323" font-size="17" text-anchor="middle" style="fill:#253448">7 NC2</text>
<polyline class="wire" points="975,335 1160,335" stroke="#08796b"/>
<text x="1185" y="323" font-size="18" text-anchor="start" style="fill:#253448">D / SDA</text>
<text x="745" y="364" font-size="15" text-anchor="middle" style="fill:#08796b">LOW connects NC</text>
<text x="95" y="399" font-size="18" text-anchor="start" style="fill:#253448">2  BCK / GPIO42</text>
<text x="95" y="425" font-size="16" text-anchor="start" style="fill:#1760a0">→ detector below</text>
<text x="565" y="401" font-size="18" text-anchor="start" style="fill:#a95b08">2 NO1 + 4 NO2: leave OPEN</text>
<text x="565" y="433" font-size="18" text-anchor="start" style="fill:#a95b08">1 IN1 + 5 IN2: SELECT</text>
<text x="565" y="467" font-size="17" text-anchor="start" style="fill:#253448">8 V+ = 3.3 V; 3 GND = ground</text>
<text x="1185" y="385" font-size="18" text-anchor="start" style="fill:#253448">+ = 3.3 V</text>
<text x="1185" y="416" font-size="18" text-anchor="start" style="fill:#253448">− = GND</text>
<text x="1185" y="449" font-size="18" text-anchor="start" style="fill:#a95b08">NC: leave OPEN</text>
<text x="65" y="528" font-size="17" text-anchor="start" style="fill:#253448">RTC-side pull-ups only: D → 4.7k → 3.3 V; C → 4.7k → 3.3 V. Omit added resistors if module pull-ups are confirmed.</text>
<rect x="40" y="570" width="1420" height="305" rx="6" fill="#f1f5f9" stroke="#b7c6d6" stroke-width="2"/>
<text x="65" y="607" font-size="22" text-anchor="start" style="fill:#253448" font-weight="bold">B. Detector — a branch from BCK; never interrupt the amplifier clock wire</text>
<text x="65" y="659" font-size="17" text-anchor="start" style="fill:#253448">J5 pad 2</text>
<text x="65" y="683" font-size="17" text-anchor="start" style="fill:#253448">BCK</text>
<polyline class="wire" points="160,690 205,690" stroke="#1760a0"/>
<rect x="205" y="679" width="80" height="22" rx="6" fill="#ffffff" stroke="#253448" stroke-width="2"/>
<text x="205" y="669" font-size="16" text-anchor="start" style="fill:#253448">R1 1kΩ</text>
<polyline class="wire" points="285,690 325,690" stroke="#1760a0"/>
<path d="M325 675 L325 705 L350 690 Z" fill="none" stroke="#253448" stroke-width="3"/>
<polyline class="wire" points="351,671 351,709" stroke="#253448"/>
<polyline class="wire" points="351,690 735,690" stroke="#1760a0"/>
<text x="315" y="652" font-size="17" text-anchor="start" style="fill:#253448">D1 BAT43</text>
<text x="355" y="717" font-size="15" text-anchor="start" style="fill:#a95b08">band → ENV</text>
<text x="575" y="676" font-size="18" text-anchor="start" style="fill:#1760a0" font-weight="bold">ENV</text>
<circle cx="510" cy="690" r="5" fill="#1760a0"/>
<polyline class="wire" points="510,690 510,740" stroke="#1760a0"/>
<rect x="501" y="740" width="18" height="58" rx="6" fill="#ffffff" stroke="#253448" stroke-width="2"/>
<text x="533" y="767" font-size="16" text-anchor="start" style="fill:#253448">R2 47kΩ</text>
<polyline class="wire" points="510,798 510,824" stroke="#253448"/>
<polyline class="wire" points="510,824 510,836" stroke="#253448"/>
<polyline class="wire" points="496,836 524,836" stroke="#253448"/>
<polyline class="wire" points="501,842 519,842" stroke="#253448"/>
<polyline class="wire" points="506,848 514,848" stroke="#253448"/>
<circle cx="660" cy="690" r="5" fill="#1760a0"/>
<polyline class="wire" points="660,690 660,736" stroke="#1760a0"/>
<polyline class="wire" points="660,736 660,754" stroke="#253448"/>
<polyline class="wire" points="646,754 674,754" stroke="#253448"/>
<polyline class="wire" points="646,764 674,764" stroke="#253448"/>
<polyline class="wire" points="660,764 660,806" stroke="#253448"/>
<text x="683" y="771" font-size="16" text-anchor="start" style="fill:#253448"></text>
<text x="660" y="866" font-size="16" text-anchor="middle" style="fill:#253448">Cenv 100nF</text>
<polyline class="wire" points="660,806 660,824" stroke="#253448"/>
<polyline class="wire" points="660,824 660,836" stroke="#253448"/>
<polyline class="wire" points="646,836 674,836" stroke="#253448"/>
<polyline class="wire" points="651,842 669,842" stroke="#253448"/>
<polyline class="wire" points="656,848 664,848" stroke="#253448"/>
<rect x="735" y="647" width="305" height="144" rx="6" fill="#e9f7f2" stroke="#b7c6d6" stroke-width="2"/>
<text x="758" y="674" font-size="20" text-anchor="start" style="fill:#253448" font-weight="bold">U2 SN74LVC1G17</text>
<text x="758" y="703" font-size="17" text-anchor="start" style="fill:#253448">2 A → non-inverting → 4 Y</text>
<text x="758" y="735" font-size="17" text-anchor="start" style="fill:#253448">5 VCC = 3.3 V; 3 GND</text>
<text x="758" y="767" font-size="17" text-anchor="start" style="fill:#a95b08">1 NC: leave OPEN</text>
<polyline class="wire" points="1040,690 1380,690" stroke="#a95b08"/>
<text x="1150" y="650" font-size="18" text-anchor="start" style="fill:#a95b08" font-weight="bold">SELECT</text>
<text x="1300" y="675" font-size="17" text-anchor="middle" style="fill:#a95b08">to U1 pins 1 + 5</text>
<circle cx="1140" cy="690" r="5" fill="#a95b08"/>
<polyline class="wire" points="1140,690 1140,740" stroke="#a95b08"/>
<rect x="1131" y="740" width="18" height="58" rx="6" fill="#ffffff" stroke="#253448" stroke-width="2"/>
<text x="1163" y="767" font-size="16" text-anchor="start" style="fill:#253448">R3 100kΩ</text>
<polyline class="wire" points="1140,798 1140,824" stroke="#253448"/>
<polyline class="wire" points="1140,824 1140,836" stroke="#253448"/>
<polyline class="wire" points="1126,836 1154,836" stroke="#253448"/>
<polyline class="wire" points="1131,842 1149,842" stroke="#253448"/>
<polyline class="wire" points="1136,848 1144,848" stroke="#253448"/>
<rect x="40" y="895" width="1420" height="143" rx="6" fill="#fff6e9" stroke="#b7c6d6" stroke-width="2"/>
<text x="65" y="927" font-size="19" text-anchor="start" style="fill:#253448" font-weight="bold">Power: J5 pad 7 VIN = +3V3; J5 pad 6 = GND. Every ground symbol uses this same system ground.</text>
<text x="65" y="958" font-size="18" text-anchor="start" style="fill:#253448">Cbuf 100nF: U2 pins 5 ↔ 3.  Csw 100nF: U1 pins 8 ↔ 3.  Crtc 1µF: module + ↔ −. Place close to each device.</text>
<text x="65" y="989" font-size="18" text-anchor="start" style="fill:#253448">BCK HIGH / clocking → SELECT HIGH → RTC isolated. BCK LOW, after settling → SELECT LOW → RTC connected.</text>
<text x="65" y="1020" font-size="18" text-anchor="start" style="fill:#a95b08">Do not connect SELECT to GPIO46/SLEEP. Provisional waits: 2ms HIGH before audio; 20ms LOW before I²C.</text>
</svg>
